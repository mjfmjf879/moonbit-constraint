name: MoonBit quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install latest stable MoonBit on Unix
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install latest stable MoonBit on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify toolchain and dependencies
        shell: bash
        run: |
          moon version --all
          moonc_version="$(moonc -v 2>&1 | sed -n \
            -e 's/^moonc v\([0-9][0-9.]*\).*/\1/p' \
            -e 's/^v\([0-9][0-9.]*\).*/\1/p' | head -n 1)"
          test -n "$moonc_version"
          awk -v version="$moonc_version" 'BEGIN {
            split(version, part, ".")
            if (part[1] < 0 || (part[1] == 0 && part[2] < 10) ||
                (part[1] == 0 && part[2] == 10 && part[3] < 9)) {
              print "moonc >= v0.10.9 is required; found v" version > "/dev/stderr"
              exit 1
            }
          }'
          moon update

      - name: Check every backend
        shell: bash
        run: moon check --target all --deny-warn

      - name: Build every backend
        shell: bash
        run: moon build --target all --deny-warn

      - name: Test every backend with coverage
        shell: bash
        run: moon test --target all --deny-warn --enable-coverage

      - name: Run deterministic application benchmarks
        shell: bash
        run: moon run --target native cmd/benchmark

      - name: Run the command-line example
        shell: bash
        run: moon run --target native cmd/main

      - name: Verify formatting
        shell: bash
        run: moon fmt --check

      - name: Verify generated interfaces
        shell: bash
        run: |
          moon info
          git diff --exit-code

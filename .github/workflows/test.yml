name: MoonBit check and test

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MoonBit on Unix
        if: matrix.os != 'windows-latest'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Verify toolchain
        run: moon version --all
      - name: Check all backends
        run: moon check --target all --deny-warn
      - name: Test all backends
        run: moon test --target all --deny-warn
      - name: Verify formatting
        run: |
          moon fmt --warn
          git diff --exit-code
      - name: Verify generated interfaces
        run: |
          moon info
          git diff --exit-code
